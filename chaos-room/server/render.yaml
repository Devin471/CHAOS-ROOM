services:
  - type: web
    name: chaos-room-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: chaos-room-db
          property: connectionString

databases:
  - name: chaos-room-db
    plan: free
    databaseName: chaos_room
    user: chaos_admin
